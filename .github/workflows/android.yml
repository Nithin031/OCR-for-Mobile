name: Android build

# Runs the unit tests and builds the debug APK on every push and pull request.
# The APK is attached to each run as the "app-debug-apk" artifact.
on:
  push:
    paths-ignore:
      - "tools/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "tools/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14.3 runs on Java 17-24.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :ocr-core:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: ocr-core/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
